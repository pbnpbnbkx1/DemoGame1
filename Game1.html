<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Game1 Prototype V4.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui;touch-action:none}
#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#23354a,#426b70 58%,#405d38 58%,#263d2b);user-select:none}
#hud{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:12px;background:#0009;padding:7px 12px;border-radius:9px;font-weight:700}
#msg{position:absolute;z-index:20;top:12px;left:50%;transform:translateX(-50%);font-size:13px;color:#ddd;transition:opacity .4s}#timer{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));right:12px;background:#0009;padding:7px 12px;border-radius:9px;font-weight:700}#attackRangePanel{position:absolute;z-index:31;top:max(52px,calc(env(safe-area-inset-top) + 52px));right:12px;background:#0009;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}#attackRange{width:110px;touch-action:auto}#attackRangeValue{display:inline-block;min-width:32px;text-align:right}
.actor{position:absolute;width:42px;height:42px;border-radius:12px;transform:translate(-50%,-50%)}
#player{z-index:8;left:50%;top:78%;background:#b72f35;border:4px solid #e8bd58;box-shadow:0 6px 0 #692127}
#player:before{content:"";position:absolute;width:24px;height:19px;left:5px;top:-15px;border-radius:50% 50% 35% 35%;background:#d9a071;border:3px solid #542d27}
#weapon{position:absolute;z-index:9;left:50%;top:50%;width:72px;height:10px;border-radius:6px;background:#d9b36c;border:2px solid #6e4828;transform-origin:6px 50%;transform:translate(8px,-50%) rotate(0deg);opacity:0;pointer-events:none}
#weapon.attack{opacity:1;animation:thrust .24s ease-out}@keyframes thrust{0%{width:28px}45%{width:92px}100%{width:72px;opacity:0}}
.enemy{z-index:6;background:#58225f;border:4px solid #b76ac2;border-radius:50% 50% 40% 40%}
.enemy:after{content:"💣";position:absolute;font-size:18px;left:8px;top:7px}
.bomberOne{z-index:7;overflow:visible}.bomberOne .wing{position:absolute;top:9px;font-size:18px;animation:wingFlap .22s ease-in-out infinite alternate}.bomberOne .wing.left{left:-17px}.bomberOne .wing.right{right:-17px;transform:scaleX(-1)}@keyframes wingFlap{from{margin-top:-4px}to{margin-top:5px}}
.littleBoss{z-index:7;width:58px;height:58px;background:#783b16;border:5px solid #e0a43b;border-radius:18px;box-shadow:0 0 0 3px #4b210d}
.littleBoss:after{content:"👹";position:absolute;font-size:31px;left:8px;top:7px}
.bossHp{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#fff;text-shadow:0 1px 2px #000}.runner{z-index:7;width:46px;height:46px;background:#174f77;border:4px solid #62c7ff;border-radius:50%;box-shadow:0 0 0 2px #09283d}.runner:after{content:'🏃';position:absolute;font-size:25px;left:6px;top:5px}.greenGhost{z-index:7;width:58px;height:58px;background:#176b45;border:5px solid #64e3a1;border-radius:18px;box-shadow:0 0 0 3px #0b3c27}.greenGhost:after{content:'👹';position:absolute;font-size:31px;left:8px;top:7px;filter:hue-rotate(80deg)}.spellWarning{animation:spellShake .12s linear infinite}@keyframes spellShake{0%,100%{margin-left:0}25%{margin-left:-4px}75%{margin-left:4px}}.spellCount{position:absolute;z-index:18;left:50%;top:-31px;transform:translateX(-50%);font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none}
.heart{z-index:5;background:transparent;font-size:31px;text-align:center;line-height:42px}
.boom{position:absolute;z-index:15;transform:translate(-50%,-50%);font-size:45px;animation:boom .42s forwards}@keyframes boom{to{transform:translate(-50%,-50%) scale(2);opacity:0}}
#joystick{position:absolute;z-index:30;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:114px;height:114px;border-radius:50%;background:#ffffff18;border:3px solid #ffffff42;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#ffffff45;border:2px solid #ffffff75;transform:translate(-50%,-50%);pointer-events:none}
#attackJoy{position:absolute;z-index:30;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:91px;height:91px;border-radius:50%;background:#b8322b55;border:3px solid #ffb7a888;touch-action:none}#attackStick{position:absolute;left:50%;top:50%;width:38px;height:38px;border-radius:50%;background:#d94a42;border:2px solid #ffb7a8;transform:translate(-50%,-50%);pointer-events:none}
#gameover{display:none;position:absolute;z-index:50;inset:0;background:#000b;place-items:center;text-align:center;font-size:28px}
#gameover button{font-size:18px;padding:10px 20px}
#startScreen{position:absolute;z-index:60;inset:0;background:#000b;display:grid;place-items:center;text-align:center}#startScreen button{font-size:22px;font-weight:700;padding:14px 28px;border:0;border-radius:12px;cursor:pointer}#startScreen small{display:block;margin-top:10px;color:#ddd}
#debugCanvas{position:absolute;z-index:19;inset:0;width:100%;height:100%;pointer-events:none}
#debugPanel{position:absolute;z-index:32;top:92px;right:12px;background:#0009;padding:6px 9px;border-radius:9px;font-size:12px}#spellDebugConsole{display:none;position:absolute;z-index:33;top:126px;right:12px;width:min(330px,calc(100vw - 24px));max-height:220px;overflow:hidden;background:#071019e8;border:1px solid #4d6b7a;border-radius:9px;padding:8px;font:11px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;color:#cdefff;pointer-events:none}#spellDebugConsole .title{font-weight:800;color:#fff;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}#exportSpellLog{font:10px system-ui;padding:2px 6px;cursor:pointer;pointer-events:auto}#spellDebugLog{white-space:pre-wrap}
</style></head><body><div id="game">
<div id="startScreen"><div><button id="startButton">開始遊戲</button><small>按下後才開始計時、移動與產生敵人</small></div></div>
<div id="hud">HP：<span id="hp">100</span></div><div id="msg">Bomber 5秒 · Runner 15秒 · Boss 30秒</div><div id="timer">生存：<span id="timeLeft">180</span>s</div><label id="attackRangePanel">Attack Range <input id="attackRange" type="range" min="0" max="100" step="5" value="35"><span id="attackRangeValue">35%</span></label>
<canvas id="debugCanvas"></canvas><label id="debugPanel"><input id="debugHitbox" type="checkbox"> Debug Hitbox</label><div id="spellDebugConsole"><div class="title"><span>Spell Debug</span><button id="exportSpellLog" type="button">Export JSON</button></div><div id="spellDebugStatus"></div><div id="spellDebugLog"></div></div>
<div id="player" class="actor"><div id="weapon"></div></div>
<div id="joystick" aria-label="移動搖桿"><div id="stick"></div></div>
<div id="attackJoy" aria-label="攻擊搖桿"><div id="attackStick"></div></div>
<div id="gameover"><div><span id="endText">GAME OVER</span><br><button onclick="location.reload()">重新開始</button></div></div>
</div>
<script>
const game=document.querySelector('#game'),player=document.querySelector('#player'),hpEl=document.querySelector('#hp');
let hp=100,px=.5,py=.78,last=performance.now(),enemyTimer=0,bossTimer=0,runnerTimer=0,bomberOneTimer=0,greenGhostTimer=0,healTimer=20+Math.random()*10,survival=180,running=false,started=false;
const enemies=[],hearts=[]; const SPEED=.34, ENEMY_SPEED=.105, BOSS_SPEED=.075, RUNNER_SPEED=.25, GREEN_GHOST_SPEED=.055, BOMBER_ONE_SPEED=.27, BOMBER_ONE_BOOST_SPEED=.30;
const SPELL_RANDOM_MIN=1,SPELL_RANDOM_MAX=3;
const SPELLS={runnerDash:{id:'runnerDash',cooldown:3,warning:3,stun:2},greenShockwave:{id:'greenShockwave',cooldown:8,warning:3,triggerRange:200,range:150,angle:120,damage:30,stun:5}};
let spellClock=0,spellSchedulerAcc=0;const SPELL_SCHEDULER_STEP=.1;
function randomSpellDelay(){return SPELL_RANDOM_MIN+Math.random()*(SPELL_RANDOM_MAX-SPELL_RANDOM_MIN)}
function makeSpellState(spell,initialDelay=null){const delay=initialDelay??randomSpellDelay();return{phase:'waiting',timer:delay,nextCastAt:spellClock+delay,count:0,dirX:0,dirY:0,hit:false,casts:0,rangeEntered:false}}
function resetGameState(){hp=100;hpEl.textContent=hp;px=.5;py=.78;spellClock=0;spellSchedulerAcc=0;enemyTimer=0;bossTimer=0;runnerTimer=0;bomberOneTimer=0;greenGhostTimer=0;healTimer=20+Math.random()*10;survival=180;document.querySelector('#timeLeft').textContent='180';playerInvincible=0;playerStun=0;attacking=false;attackElapsed=0;attackHits=new Set();joyX=joyY=atkX=atkY=0;faceX=1;faceY=0;for(const e of enemies)e.el.remove();enemies.length=0;for(const h of hearts)h.el.remove();hearts.length=0;pos(player,px,py);document.querySelector('#weapon').classList.remove('attack');debugCtx.clearRect(0,0,debugCanvas.width,debugCanvas.height)}
function startGame(){resetGameState();started=true;running=true;last=performance.now();document.querySelector('#startScreen').style.display='none';document.querySelector('#msg').style.opacity='1';document.querySelector('#msg').style.display='block';setTimeout(()=>{if(started){document.querySelector('#msg').style.opacity='0';setTimeout(()=>document.querySelector('#msg').style.display='none',450)}},5000);requestAnimationFrame(loop)}
document.querySelector('#startButton').onclick=startGame;
let joyX=0,joyY=0,faceX=1,faceY=0,attacking=false,attackElapsed=0,attackHits=new Set(),attackOriginX=0,attackOriginY=0,attackDirX=1,attackDirY=0,playerInvincible=0,playerStun=0,attackTolerance=.35;
const PLAYER_RADIUS=19,BOMBER_RADIUS=19,RUNNER_RADIUS=21,BOSS_RADIUS=27,ATTACK_DURATION=.26,WEAPON_LENGTH=92,WEAPON_BASE_RADIUS=7;
const debugCanvas=document.querySelector('#debugCanvas'),debugCtx=debugCanvas.getContext('2d'),debugHitbox=document.querySelector('#debugHitbox'),spellDebugConsole=document.querySelector('#spellDebugConsole'),spellDebugStatus=document.querySelector('#spellDebugStatus'),spellDebugLog=document.querySelector('#spellDebugLog'),exportSpellLog=document.querySelector('#exportSpellLog');const spellLogs=[],spellDebugData=[];function spellDebug(msg,data={}){if(!debugHitbox.checked)return;const elapsed=180-survival,t=elapsed.toFixed(1).padStart(5,' ');spellLogs.unshift('['+t+'s] '+msg);spellLogs.length=Math.min(spellLogs.length,10);spellDebugData.push({time:Number(elapsed.toFixed(3)),message:msg,...data});if(spellDebugData.length>300)spellDebugData.shift();spellDebugLog.textContent=spellLogs.join('\n')}function refreshSpellDebug(){spellDebugConsole.style.display=debugHitbox.checked?'block':'none';if(!debugHitbox.checked)return;let r=0,g=0,rc=0,gc=0;for(const e of enemies){if(e.type==='runner'){r++;rc+=e.spellStates?.runnerDash?.casts||0}if(e.type==='greenGhost'){g++;gc+=e.spellStates?.greenShockwave?.casts||0}}spellDebugStatus.textContent='Runner '+r+' / casts '+rc+' | Green '+g+' / casts '+gc+' | logs '+spellDebugData.length+'/300'}debugHitbox.addEventListener('change',()=>{if(!debugHitbox.checked){spellLogs.length=0;spellDebugData.length=0;spellDebugLog.textContent=''}refreshSpellDebug();if(debugHitbox.checked)spellDebug('debug enabled')});exportSpellLog.onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),logs:spellDebugData},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spell-debug-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function resizeDebug(){debugCanvas.width=game.clientWidth;debugCanvas.height=game.clientHeight}addEventListener('resize',resizeDebug);resizeDebug();
function enemyRadius(e){return e.type==='littleBoss1'||e.type==='greenGhost'?BOSS_RADIUS:e.type==='runner'?RUNNER_RADIUS:BOMBER_RADIUS}
function pointSegDist(x,y,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,d=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/d));return Math.hypot(x-(ax+dx*t),y-(ay+dy*t))}
function capsule(){const w=game.clientWidth,h=game.clientHeight,ux=attackDirX,uy=attackDirY,sx=attackOriginX*w+ux*8,sy=attackOriginY*h+uy*8,p=Math.min(1,attackElapsed/(ATTACK_DURATION*.45)),len=28+(WEAPON_LENGTH-28)*p;return{sx,sy,ex:sx+ux*len,ey:sy+uy*len,r:WEAPON_BASE_RADIUS*(1+attackTolerance),ux,uy}}
const attackRange=document.querySelector('#attackRange'),attackRangeValue=document.querySelector('#attackRangeValue');attackRange.oninput=()=>{attackTolerance=Number(attackRange.value)/100;attackRangeValue.textContent=attackRange.value+'%'};
function beep(freq=300,dur=.07,type='square'){try{const A=window.AudioContext||window.webkitAudioContext;window.ac??=new A();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch{}}
const joystick=document.querySelector('#joystick'),stick=document.querySelector('#stick');
function setJoy(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;let x=e.clientX-cx,y=e.clientY-cy,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}joyX=x/max;joyY=y/max;stick.style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))';if(Math.hypot(joyX,joyY)>.15){faceX=joyX;faceY=joyY}}
joystick.onpointerdown=e=>{e.preventDefault();joystick.setPointerCapture(e.pointerId);setJoy(e)};
joystick.onpointermove=e=>{if(joystick.hasPointerCapture(e.pointerId))setJoy(e)};
joystick.onpointerup=joystick.onpointercancel=e=>{joyX=joyY=0;stick.style.transform='translate(-50%,-50%)'};
const attackJoy=document.querySelector('#attackJoy'),attackStick=document.querySelector('#attackStick');let atkX=0,atkY=0;
function setAttackJoy(e){const r=attackJoy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.3;let x=e.clientX-cx,y=e.clientY-cy,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}atkX=x/max;atkY=y/max;attackStick.style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))'}
attackJoy.onpointerdown=e=>{e.preventDefault();attackJoy.setPointerCapture(e.pointerId);setAttackJoy(e)};attackJoy.onpointermove=e=>{if(attackJoy.hasPointerCapture(e.pointerId))setAttackJoy(e)};attackJoy.onpointerup=attackJoy.onpointercancel=e=>{if(Math.hypot(atkX,atkY)>.15){faceX=atkX;faceY=atkY;attack()}atkX=atkY=0;attackStick.style.transform='translate(-50%,-50%)'};
function pos(el,x,y){el.style.left=x*100+'%';el.style.top=y*100+'%'}
function spawnEnemy(){const el=document.createElement('div');el.className='actor enemy';const e={el,x:.08+Math.random()*.84,y:-.05};game.append(el);enemies.push(e);pos(el,e.x,e.y);beep(170,.1,'sawtooth')}
function edgeSpawn(){const s=Math.floor(Math.random()*4),p=.08+Math.random()*.84;return s===0?{x:p,y:.06}:s===1?{x:.94,y:p}:s===2?{x:p,y:.94}:{x:.06,y:p}}
function spawnBoss(){const el=document.createElement('div');el.className='actor littleBoss';const hpTag=document.createElement('div');hpTag.className='bossHp';hpTag.textContent='Red Ghost · HP 3';el.append(hpTag);const p=edgeSpawn(),e={el,type:'littleBoss1',x:p.x,y:p.y,hp:3,speed:BOSS_SPEED,attack:10,contactKnockback:.6,hpTag};game.append(el);enemies.push(e);pos(el,e.x,e.y);beep(110,.18,'sawtooth')}
function spawnBomberOneAt(p){const el=document.createElement('div');el.className='actor enemy bomberOne';el.insertAdjacentHTML('beforeend','<span class="wing left">🪽</span><span class="wing right">🪽</span>');const e={el,type:'bomberOne',x:p.x,y:p.y,hp:1,speed:BOMBER_ONE_SPEED,attack:10,boostLeft:0,nextBoost:2+Math.random()};game.append(el);enemies.push(e);pos(el,e.x,e.y)}function spawnBomberOne(){const p=edgeSpawn(),op={x:1-p.x,y:1-p.y};spawnBomberOneAt(p);spawnBomberOneAt(op);beep(210,.12,'sawtooth')}
function spawnRunner(){const el=document.createElement('div');el.className='actor runner';const hpTag=document.createElement('div');hpTag.className='bossHp';hpTag.textContent='Runner · HP 3';el.append(hpTag);const p=edgeSpawn(),e={el,type:'runner',x:p.x,y:p.y,hp:3,speed:RUNNER_SPEED,attack:1,contactKnockback:1.2,hpTag,spells:['runnerDash'],spellStates:{runnerDash:makeSpellState(SPELLS.runnerDash,1)}};game.append(el);enemies.push(e);pos(el,e.x,e.y);spellDebug('runner SPAWN -> spell runtime initialized',{enemy:'runner',spell:'runnerDash',phase:'waiting',timer:Number(e.spellStates.runnerDash.timer.toFixed(3))});beep(260,.1,'square')}
function spawnGreenGhost(){const el=document.createElement('div');el.className='actor greenGhost';const hpTag=document.createElement('div');hpTag.className='bossHp';hpTag.textContent='Green Ghost · HP 5';el.append(hpTag);const p=edgeSpawn(),e={el,type:'greenGhost',x:p.x,y:p.y,hp:5,speed:GREEN_GHOST_SPEED,attack:0,hpTag,spells:['greenShockwave'],spellStates:{greenShockwave:makeSpellState(SPELLS.greenShockwave)}};game.append(el);enemies.push(e);pos(el,e.x,e.y);spellDebug('greenGhost SPAWN -> spell runtime initialized',{enemy:'greenGhost',spell:'greenShockwave',phase:'waiting',timer:Number(e.spellStates.greenShockwave.timer.toFixed(3))});beep(145,.16,'sawtooth')}
function spawnHeart(){const el=document.createElement('div');el.className='actor heart';el.textContent='💚';const h={el,x:.12+Math.random()*.76,y:.08+Math.random()*.45};game.append(el);hearts.push(h);pos(el,h.x,h.y);beep(600,.09,'sine')}
function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function explode(x,y){const e=document.createElement('div');e.className='boom';e.textContent='💥';pos(e,x,y);game.append(e);setTimeout(()=>e.remove(),450)}
function applyAttackHit(e,q){attackHits.add(e);if(e.type==='littleBoss1'||e.type==='runner'||e.type==='greenGhost'){e.hp--;e.hpTag.textContent=(e.type==='runner'?'Runner':e.type==='greenGhost'?'Green Ghost':'Red Ghost')+' · HP '+e.hp;e.x+=q.ux*.045;e.y+=q.uy*.045;beep(620,.07,'square');if(e.hp>0)return}explode(e.x,e.y);e.el.remove();const k=enemies.indexOf(e);if(k>=0)enemies.splice(k,1);beep(700,.08,'square')}
function checkAttack(){const q=capsule(),w=game.clientWidth,h=game.clientHeight;for(const e of [...enemies])if(!attackHits.has(e)&&pointSegDist(e.x*w,e.y*h,q.sx,q.sy,q.ex,q.ey)<=q.r+enemyRadius(e))applyAttackHit(e,q)}
function attack(){if(!running||attacking)return;const n=Math.max(.001,Math.hypot(faceX,faceY));attackOriginX=px;attackOriginY=py;attackDirX=faceX/n;attackDirY=faceY/n;attacking=true;attackElapsed=0;attackHits=new Set();const weapon=document.querySelector('#weapon'),ang=Math.atan2(attackDirY,attackDirX);weapon.style.transform='translate(8px,-50%) rotate('+ang+'rad)';weapon.classList.remove('attack');void weapon.offsetWidth;weapon.classList.add('attack');beep(420,.08,'square')}
addEventListener('keydown',e=>{if(e.key===' '||e.key==='k')attack()});

function clearSpellWarning(e){e.el.classList.remove('spellWarning');e.el.querySelector('.spellCount')?.remove()}
function startSpellWarning(e,state,spell){const vx=px-e.x,vy=py-e.y,l=Math.max(.001,Math.hypot(vx,vy));state.phase='warning';state.timer=spell.warning;state.casts++;spellDebug((e.type||'enemy')+' '+spell.id+' TRIGGER -> warning 3',{enemy:e.type,spell:spell.id,phase:'warning'});state.dirX=vx/l;state.dirY=vy/l;state.hit=false;e.el.classList.add('spellWarning');beep(330,.08,'square')}
function finishSpell(e,state,spell){clearSpellWarning(e);state.phase='waiting';const rnd=randomSpellDelay(),delay=spell.cooldown+rnd;state.timer=delay;state.nextCastAt=spellClock+delay;state.hit=false;spellDebug((e.type||'enemy')+' '+spell.id+' finish -> cooldown '+spell.cooldown.toFixed(0)+'s + random '+rnd.toFixed(1)+'s',{enemy:e.type,spell:spell.id,phase:'waiting',cooldown:spell.cooldown,randomDelay:Number(rnd.toFixed(3)),nextCastAt:Number(state.nextCastAt.toFixed(3))})}
function castGreenShockwave(e,state,spell){state.phase='casting';state.timer=.22;spellDebug('greenGhost greenShockwave CAST',{enemy:'greenGhost',spell:'greenShockwave',phase:'casting'});const w=game.clientWidth,h=game.clientHeight,dx=(px-e.x)*w,dy=(py-e.y)*h,d=Math.hypot(dx,dy),dot=d?((dx/d)*state.dirX+(dy/d)*state.dirY):-1,limit=Math.cos(spell.angle*Math.PI/360);if(d<=spell.range+PLAYER_RADIUS&&dot>=limit&&!state.hit){state.hit=true;hp=Math.max(0,hp-spell.damage);hpEl.textContent=hp;playerStun=Math.max(playerStun,spell.stun);playerInvincible=Math.max(playerInvincible,.6);beep(70,.28,'sawtooth')}explode(e.x,e.y)}
function updateEnemySpell(e,dt,schedulerTick){if(!e.spells)return false;const id=e.spells[0],spell=SPELLS[id],state=e.spellStates[id];if(state.phase==='waiting'){if(!schedulerTick)return false;if(id==='greenShockwave'){const d=Math.hypot((px-e.x)*game.clientWidth,(py-e.y)*game.clientHeight);if(d>spell.triggerRange){state.rangeEntered=false;return false}if(!state.rangeEntered){state.rangeEntered=true;if(state.casts===0)state.nextCastAt=spellClock+randomSpellDelay();spellDebug('greenGhost entered '+spell.triggerRange+'px range; schedule '+(state.nextCastAt-spellClock).toFixed(1)+'s',{enemy:'greenGhost',spell:id,phase:state.phase,distance:Number(d.toFixed(2)),nextCastAt:Number(state.nextCastAt.toFixed(3))})}}state.timer=Math.max(0,state.nextCastAt-spellClock);if(spellClock>=state.nextCastAt)startSpellWarning(e,state,spell);return state.phase!=='waiting'}if(state.phase==='warning'){state.timer-=dt;if(state.timer<=0){clearSpellWarning(e);if(id==='runnerDash'){state.phase='casting';state.timer=0;spellDebug('runner runnerDash CAST',{enemy:'runner',spell:id,phase:'casting'})}else castGreenShockwave(e,state,spell)}return true}if(state.phase==='casting'){if(id==='runnerDash'){const oldX=e.x,oldY=e.y;e.x+=state.dirX*.72*dt;e.y+=state.dirY*.72*dt;const w=game.clientWidth,h=game.clientHeight;if(!state.hit&&pointSegDist(px*w,py*h,oldX*w,oldY*h,e.x*w,e.y*h)<=PLAYER_RADIUS+enemyRadius(e)){state.hit=true;playerStun=Math.max(playerStun,spell.stun);beep(90,.18,'sawtooth')}if(e.x<=.03||e.x>=.97||e.y<=.06||e.y>=.94)finishSpell(e,state,spell)}else{state.timer-=dt;if(state.timer<=0)finishSpell(e,state,spell)}return true}return false}

function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.05);last=now;
 playerStun=Math.max(0,playerStun-dt);if(attacking){attackElapsed+=dt;checkAttack();if(attackElapsed>=ATTACK_DURATION){attacking=false;document.querySelector('#weapon').classList.remove('attack')}}let dx=joyX,dy=joyY;if(playerStun<=0&&(dx||dy)){let l=Math.hypot(dx,dy),power=Math.min(1,l);px+=dx/l*SPEED*power*dt;py+=dy/l*SPEED*power*dt}
 px=Math.max(.05,Math.min(.95,px));py=Math.max(.12,Math.min(.87,py));pos(player,px,py);
 spellClock+=dt;spellSchedulerAcc+=dt;const spellSchedulerTick=spellSchedulerAcc>=SPELL_SCHEDULER_STEP;if(spellSchedulerTick)spellSchedulerAcc%=SPELL_SCHEDULER_STEP;survival-=dt;document.querySelector('#timeLeft').textContent=Math.max(0,Math.ceil(survival));if(survival<=0){running=false;document.querySelector('#endText').textContent='YOU WIN';document.querySelector('#gameover').style.display='grid';return}const elapsed=180-survival,spawnScale=elapsed>=120?.25:elapsed>=60?.5:1;enemyTimer+=dt;if(enemyTimer>=5*spawnScale){enemyTimer-=5*spawnScale;spawnEnemy()} runnerTimer+=dt;if(runnerTimer>=15*spawnScale){runnerTimer-=15*spawnScale;spawnRunner()} bomberOneTimer+=dt;if(bomberOneTimer>=10*spawnScale){bomberOneTimer-=10*spawnScale;spawnBomberOne()} greenGhostTimer+=dt;if(greenGhostTimer>=25*spawnScale){greenGhostTimer-=25*spawnScale;spawnGreenGhost()} bossTimer+=dt;if(bossTimer>=30*spawnScale){bossTimer-=30*spawnScale;spawnBoss()} healTimer-=dt;playerInvincible=Math.max(0,playerInvincible-dt);if(healTimer<=0){spawnHeart();healTimer=20+Math.random()*10}
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];const spellBusy=updateEnemySpell(e,dt,spellSchedulerTick);if(spellBusy){pos(e.el,e.x,e.y)}else if(e.type==='littleBoss1'||e.type==='runner'||e.type==='bomberOne'||e.type==='greenGhost'){let vx=px-e.x,vy=py-e.y,l=Math.max(.001,Math.hypot(vx,vy)),speed=e.speed;if(e.type==='bomberOne'){e.nextBoost-=dt;if(e.nextBoost<=0&&e.boostLeft<=0){e.boostLeft=1;e.nextBoost=2+Math.random()}if(e.boostLeft>0){e.boostLeft-=dt;speed=BOMBER_ONE_BOOST_SPEED}}e.x+=vx/l*speed*dt;e.y+=vy/l*speed*dt}else e.y+=ENEMY_SPEED*dt;pos(e.el,e.x,e.y);if(Math.hypot((px-e.x)*game.clientWidth,(py-e.y)*game.clientHeight)<=PLAYER_RADIUS+enemyRadius(e)&&playerInvincible<=0&&e.type!=='greenGhost'&&!(e.type==='runner'&&e.spellStates?.runnerDash?.phase==='casting')){hp=Math.max(0,hp-(e.attack||10));hpEl.textContent=hp;beep(80,.2,'sawtooth');playerInvincible=1;if(e.type==='runner')playerStun=Math.max(playerStun,.5);if(e.type==='bomberOne')playerStun=Math.max(playerStun,1);if(e.type==='littleBoss1'||e.type==='runner'||e.type==='greenGhost'){const vx=e.x-px,vy=e.y-py,l=Math.max(.001,Math.hypot(vx,vy)),knockback=.06*(e.contactKnockback||1);e.x+=vx/l*knockback;e.y+=vy/l*knockback;pos(e.el,e.x,e.y)}if(e.type==='bomberOne'){explode(e.x,e.y);e.el.remove();enemies.splice(i,1)}if(!e.type)playerStun=Math.max(playerStun,.2);if(!e.type){explode(e.x,e.y);e.el.remove();enemies.splice(i,1)}if(!hp){running=false;document.querySelector('#endText').textContent='GAME OVER';document.querySelector('#gameover').style.display='grid'}continue}if(!e.type&&e.y>1.08){e.el.remove();enemies.splice(i,1)}}
 for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];if(dist(px,py,h.x,h.y)<.065){hp=Math.min(100,hp+5);hpEl.textContent=hp;h.el.remove();hearts.splice(i,1);beep(850,.12,'sine')}}
 refreshSpellDebug();if(debugHitbox.checked){debugCtx.clearRect(0,0,debugCanvas.width,debugCanvas.height);const w=game.clientWidth,h=game.clientHeight;debugCtx.lineWidth=2;debugCtx.strokeStyle='rgba(70,190,255,.9)';for(const e of enemies){debugCtx.beginPath();debugCtx.arc(e.x*w,e.y*h,enemyRadius(e),0,Math.PI*2);debugCtx.stroke()}debugCtx.strokeStyle='rgba(80,255,120,.9)';debugCtx.beginPath();debugCtx.arc(px*w,py*h,PLAYER_RADIUS,0,Math.PI*2);debugCtx.stroke();if(attacking){const q=capsule();debugCtx.strokeStyle='rgba(255,70,70,.75)';debugCtx.lineWidth=q.r*2;debugCtx.lineCap='round';debugCtx.beginPath();debugCtx.moveTo(q.sx,q.sy);debugCtx.lineTo(q.ex,q.ey);debugCtx.stroke();debugCtx.lineCap='butt'}}else debugCtx.clearRect(0,0,debugCanvas.width,debugCanvas.height);requestAnimationFrame(loop)}
pos(player,px,py);
</script></body></html>
