<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FrameEditor v0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#171a20;color:#f3f4f6;font:15px system-ui,sans-serif;overflow:hidden}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#252b35;gap:5px}button,label.btn{border:0;background:#3b4657;color:white;border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap}button:disabled{opacity:.4}button.active{background:#157a9c}button.primary{background:#1769bb}#file{display:none}#workspace{position:relative;height:calc(100dvh - 164px);overflow:hidden;touch-action:none;background:#363b45}canvas{display:block;width:100%;height:100%;touch-action:none}footer{height:110px;background:#252b35;padding:8px;display:flex;flex-direction:column;gap:8px}.tools{display:flex;gap:6px;overflow-x:auto}.tools button{flex-shrink:0}.settings{display:flex;gap:12px;align-items:center;font-size:13px}input[type=range]{width:110px}#status{font-size:12px;color:#d3dce9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#help{position:absolute;top:8px;left:8px;background:#14171bbb;border-radius:6px;padding:5px 8px;font-size:12px;pointer-events:none}@media(max-width:390px){button,label.btn{padding:9px 8px;font-size:13px}}
</style></head><body>
<header><label class="btn primary" for="file">匯入圖片</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="undo">復原</button><button id="redo">重做</button><button id="export" class="primary">匯出 PNG</button></header>
<div id="workspace"><canvas id="canvas"></canvas><div id="help">先匯入圖片。選取後可拖曳，雙指可縮放畫布。</div></div>
<footer><div class="tools"><button data-mode="pan">畫布</button><button data-mode="rect" class="active">框選</button><button data-mode="wand">魔術棒</button><button data-mode="move">移動</button><button id="flip">水平翻轉</button><button id="smaller">縮小</button><button id="larger">放大</button><button id="fit">適應</button><button id="deselect">取消選取</button></div>
<div class="settings"><label>魔術棒容差 <input id="tolerance" type="range" min="0" max="120" value="28"></label><span id="tolval">28</span><label><input id="axis" type="checkbox">水平鎖定</label></div><div id="status">尚未匯入圖片</div></footer>
<script>
(()=>{'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),workspace=document.getElementById('workspace'),status=document.getElementById('status'),help=document.getElementById('help');
const file=document.getElementById('file'),tol=document.getElementById('tolerance');let mode='rect',base=null,layer=null,view={x:0,y:0,s:1},history=[],future=[],dirty=false,gesture=null;const pointers=new Map();let rect=null;
const off=(w,h)=>{let c=document.createElement('canvas');c.width=w;c.height=h;return c};
function snapshot(){if(!base)return null;return {base:base.toDataURL(),layer:layer?{image:layer.image.toDataURL(),x:layer.x,y:layer.y,w:layer.w,h:layer.h,flip:layer.flip}:null}};
function restore(s){if(!s)return;let b=new Image();b.onload=()=>{base=off(b.width,b.height);base.getContext('2d').drawImage(b,0,0);layer=null;if(s.layer){let i=new Image();i.onload=()=>{let l=s.layer;layer={image:i,x:l.x,y:l.y,w:l.w,h:l.h,flip:l.flip};draw()};i.src=s.layer.image}else draw()};b.src=s.base}
function commit(){if(!base)return;history.push(snapshot());if(history.length>15)history.shift();future=[];dirty=true}
function update(){document.getElementById('undo').disabled=!history.length;document.getElementById('redo').disabled=!future.length;status.textContent=base?`${base.width}×${base.height}｜${Math.round(view.s*100)}%｜${layer?'已選取物件':'未選取'}${dirty?'｜未匯出':''}`:'尚未匯入圖片';help.textContent=mode==='rect'?'拖曳矩形框選區域':mode==='wand'?'點擊相近顏色區域選取':mode==='move'?'拖曳已選取物件': '拖曳畫布，雙指縮放';}
function fit(){if(!base)return;let w=workspace.clientWidth,h=workspace.clientHeight;view.s=Math.min(w/base.width,h/base.height)*.95;view.x=(w-base.width*view.s)/2;view.y=(h-base.height*view.s)/2;draw()}
function resize(){const d=window.devicePixelRatio||1,w=workspace.clientWidth,h=workspace.clientHeight;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){const d=window.devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,workspace.clientWidth,workspace.clientHeight);if(base){ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.s,view.s);ctx.fillStyle='#fff';ctx.fillRect(0,0,base.width,base.height);ctx.drawImage(base,0,0);if(layer){ctx.save();ctx.translate(layer.x+(layer.flip?layer.w:0),layer.y);ctx.scale(layer.flip?-1:1,1);ctx.drawImage(layer.image,0,0,layer.w,layer.h);ctx.restore();ctx.strokeStyle='#00c9ff';ctx.lineWidth=2/view.s;ctx.setLineDash([7/view.s,4/view.s]);ctx.strokeRect(layer.x,layer.y,layer.w,layer.h)}if(rect){ctx.strokeStyle='#ffce4a';ctx.lineWidth=2/view.s;ctx.strokeRect(rect.x,rect.y,rect.w,rect.h)}ctx.restore()}update()}
function point(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left-view.x)/view.s,y:(e.clientY-r.top-view.y)/view.s,px:e.clientX-r.left,py:e.clientY-r.top}}
function selectMask(mask){if(!base)return;let w=base.width,h=base.height,minx=w,miny=h,maxx=-1,maxy=-1;for(let y=0,k=0;y<h;y++)for(let x=0;x<w;x++,k++)if(mask[k]){minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y)}if(maxx<0)return;commit();let bw=maxx-minx+1,bh=maxy-miny+1,img=base.getContext('2d').getImageData(minx,miny,bw,bh),bc=base.getContext('2d'),data=img.data;for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){let idx=y*bw+x,k=(y+miny)*w+x+minx;if(!mask[k])data[idx*4+3]=0}let piece=off(bw,bh);piece.getContext('2d').putImageData(img,0,0);bc.save();bc.globalCompositeOperation='destination-out';bc.drawImage(piece,minx,miny);bc.restore();layer={image:piece,x:minx,y:miny,w:bw,h:bh,flip:false};mode='move';syncMode();draw()}
function selectRect(r){let w=base.width,h=base.height,x1=Math.max(0,Math.floor(Math.min(r.x,r.x+r.w))),y1=Math.max(0,Math.floor(Math.min(r.y,r.y+r.h))),x2=Math.min(w,Math.ceil(Math.max(r.x,r.x+r.w))),y2=Math.min(h,Math.ceil(Math.max(r.y,r.y+r.h)));let mask=new Uint8Array(w*h);for(let y=y1;y<y2;y++)mask.fill(1,y*w+x1,y*w+x2);selectMask(mask)}
function wand(p){let w=base.width,h=base.height,x=Math.floor(p.x),y=Math.floor(p.y);if(x<0||x>=w||y<0||y>=h)return;let data=base.getContext('2d').getImageData(0,0,w,h).data,start=y*w+x,seed=start*4,t=+tol.value,mask=new Uint8Array(w*h),seen=new Uint8Array(w*h),stack=[start];seen[start]=1;while(stack.length){let k=stack.pop(),i=k*4;if(Math.max(Math.abs(data[i]-data[seed]),Math.abs(data[i+1]-data[seed+1]),Math.abs(data[i+2]-data[seed+2]))>t||Math.abs(data[i+3]-data[seed+3])>t)continue;mask[k]=1;let xx=k%w,yy=(k-xx)/w;for(const n of [xx>0?k-1:-1,xx<w-1?k+1:-1,yy>0?k-w:-1,yy<h-1?k+w:-1])if(n>=0&&!seen[n]){seen[n]=1;stack.push(n)}}selectMask(mask)}
function syncMode(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;syncMode();draw()});tol.oninput=()=>document.getElementById('tolval').textContent=tol.value;
file.onchange=()=>{let f=file.files[0];if(!f)return;if(dirty&&!confirm('目前修改尚未匯出，確定換圖？')){file.value='';return}let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{base=off(im.naturalWidth,im.naturalHeight);base.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);layer=null;history=[];future=[];dirty=false;fit();resize();file.value=''};im.src=url};
canvas.addEventListener('pointerdown',e=>{if(!base)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,point(e));if(pointers.size===2){let a=[...pointers.values()];gesture={type:'pinch',distance:Math.hypot(a[0].px-a[1].px,a[0].py-a[1].py),s:view.s,x:view.x,y:view.y,mid:{x:(a[0].px+a[1].px)/2,y:(a[0].py+a[1].py)/2}};rect=null;return}let p=point(e);if(mode==='wand'){wand(p);return}gesture={type:mode,start:p,old:layer?{x:layer.x,y:layer.y}:null,moved:false};if(mode==='rect')rect={x:p.x,y:p.y,w:0,h:0};draw()});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!base)return;let p=point(e);pointers.set(e.pointerId,p);if(pointers.size===2&&gesture?.type==='pinch'){let a=[...pointers.values()],mid={x:(a[0].px+a[1].px)/2,y:(a[0].py+a[1].py)/2},distance=Math.hypot(a[0].px-a[1].px,a[0].py-a[1].py);let ns=Math.max(.05,Math.min(12,gesture.s*distance/Math.max(1,gesture.distance)));view.x=mid.x-(gesture.mid.x-gesture.x)*ns/gesture.s;view.y=mid.y-(gesture.mid.y-gesture.y)*ns/gesture.s;view.s=ns;draw();return}if(!gesture||gesture.type==='pinch')return;let g=gesture,dx=p.x-g.start.x,dy=p.y-g.start.y;if(Math.abs(dx)+Math.abs(dy)>1)g.moved=true;if(g.type==='rect'&&rect){rect.w=dx;rect.h=dy}else if(g.type==='pan'){view.x+=p.px-g.start.px;view.y+=p.py-g.start.py;g.start=p}else if(g.type==='move'&&layer&&g.old){layer.x=g.old.x+dx;layer.y=g.old.y+(document.getElementById('axis').checked?0:dy)}draw()});
function end(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size){gesture=null;return}if(gesture?.type==='rect'&&rect&&Math.abs(rect.w)>2&&Math.abs(rect.h)>2){let r=rect;rect=null;selectRect(r)}else if(gesture?.type==='move'&&gesture.moved&&layer&&gesture.old){let newx=layer.x,newy=layer.y;layer.x=gesture.old.x;layer.y=gesture.old.y;commit();layer.x=newx;layer.y=newy}rect=null;gesture=null;draw()}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function transform(fn){if(!layer)return;commit();fn();draw()}document.getElementById('flip').onclick=()=>transform(()=>layer.flip=!layer.flip);document.getElementById('smaller').onclick=()=>transform(()=>{layer.w*=.9;layer.h*=.9});document.getElementById('larger').onclick=()=>transform(()=>{layer.w*=1.1;layer.h*=1.1});document.getElementById('fit').onclick=fit;document.getElementById('deselect').onclick=()=>{if(!layer)return;commit();let b=base.getContext('2d');b.save();b.translate(layer.x+(layer.flip?layer.w:0),layer.y);b.scale(layer.flip?-1:1,1);b.drawImage(layer.image,0,0,layer.w,layer.h);b.restore();layer=null;draw()};
document.getElementById('undo').onclick=()=>{if(!history.length)return;future.push(snapshot());restore(history.pop());dirty=true};document.getElementById('redo').onclick=()=>{if(!future.length)return;history.push(snapshot());restore(future.pop());dirty=true};
document.getElementById('export').onclick=()=>{if(!base)return;let out=off(base.width,base.height),c=out.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,out.width,out.height);c.drawImage(base,0,0);if(layer){c.save();c.translate(layer.x+(layer.flip?layer.w:0),layer.y);c.scale(layer.flip?-1:1,1);c.drawImage(layer.image,0,0,layer.w,layer.h);c.restore()}out.toBlob(blob=>{let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='keyframe-edited.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);dirty=false;draw()},'image/png')};
window.addEventListener('resize',resize);resize();
})();
</script></body></html>
