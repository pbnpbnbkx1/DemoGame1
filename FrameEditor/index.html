<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FrameEditor v0.3.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#171a20;color:#f3f4f6;font:15px system-ui,sans-serif;overflow:hidden}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#252b35;gap:5px}button,label.btn{border:0;background:#3b4657;color:white;border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap}button:disabled{opacity:.4}button.active{background:#157a9c}button.primary{background:#1769bb}#file{display:none}#workspace{position:relative;height:calc(100dvh - 164px);overflow:hidden;touch-action:none;background:#363b45}canvas{display:block;width:100%;height:100%;touch-action:none}footer{height:110px;background:#252b35;padding:8px;display:flex;flex-direction:column;gap:8px}.tools{display:flex;gap:6px;overflow-x:auto}.tools button{flex-shrink:0}.settings{display:flex;gap:12px;align-items:center;font-size:13px}input[type=range]{width:110px}#status{font-size:12px;color:#d3dce9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#help{position:absolute;top:8px;left:8px;background:#14171bbb;border-radius:6px;padding:5px 8px;font-size:12px;pointer-events:none}@media(max-width:390px){button,label.btn{padding:9px 8px;font-size:13px}}
.layerRow{display:flex;align-items:center;gap:5px;padding:5px;border-radius:8px;background:#343d4c;margin-bottom:4px}.layerRow.chosen{outline:2px solid #16b7e0}.layerRow button{padding:6px;font-size:12px}.layerRow button:nth-child(2){flex:1;text-align:left}.layerRow canvas{width:44px;height:44px;background:#626b78}#layersPanel{position:absolute;bottom:0;left:0;right:0;max-height:48%;overflow:auto;background:#202832ed;padding:10px;z-index:5}#layersPanel[hidden],#selectionBar[hidden]{display:none!important}#selectionBar{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:80%;z-index:3}#selectionBar button{background:#146f94;font-size:12px;padding:7px}#help{top:54px}footer{height:146px}#workspace{height:calc(100dvh - 200px)}.ops{display:flex;gap:5px;overflow-x:auto}.ops button{padding:6px 10px;font-size:12px}.ops button.active{background:#167a9e}#boundaryTools{display:flex;gap:8px;align-items:center;font-size:12px}#boundaryTools button{padding:6px 10px;font-size:12px}#boundaryTools[hidden],.ops[hidden],.settings[hidden],.tools button[hidden]{display:none!important}#workspace{height:calc(100dvh - 228px)}footer{height:174px}#layersPanel{max-height:44%}#layersPanel>button{font-size:12px;padding:6px;margin-left:10px}#selectionBar{max-width:95%;left:8px;right:8px}#help{top:50px}</style></head><body>
<header><label class="btn primary" for="file">匯入圖片</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="undo">復原</button><button id="redo">重做</button><button id="export" class="primary">匯出 PNG</button></header>
<div id="workspace"><canvas id="canvas"></canvas><div id="selectionBar" hidden><button id="createLayer">建立圖層</button><button id="addToLayer">補入目前圖層</button><button id="clearMask">清除選取</button><button id="clearBoundary">清除限制框</button></div><div id="layersPanel" hidden><strong>圖層管理</strong> <button id="deselect">取消目前圖層選取</button><div id="layerItems"></div></div><div id="help">先匯入圖片。選取後可拖曳，雙指可縮放畫布。</div></div>
<footer><div class="tools"><button data-mode="pan">畫布</button><button data-mode="rect" class="active">框選</button><button data-mode="wand">魔術棒</button><button data-mode="move">移動</button><button id="flip">水平翻轉</button><button id="smaller">縮小</button><button id="larger">放大</button><button id="fit">適應</button><button id="finishEdit">完成編輯</button><button id="layersToggle">圖層 ☰</button></div>
<div id="boundaryTools"><button id="setBoundary">框選限制範圍</button><label><input type="checkbox" id="limitWand" checked>魔術棒限框內</label></div><div class="ops"><button data-op="replace">取代</button><button data-op="add" class="active">加入</button><button data-op="subtract">減去</button><button data-op="intersect">交集</button></div><div class="settings"><label>魔術棒容差 <input id="tolerance" type="range" min="0" max="120" value="28"></label><span id="tolval">28</span><label><input id="axis" type="checkbox">水平鎖定</label></div><div id="status">尚未匯入圖片</div></footer>
<script src="./editor-v03.js"></script></body></html>
